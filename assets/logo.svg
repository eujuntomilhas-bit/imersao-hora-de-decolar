<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Gabriela&amp;family=Caveat:wght@600&amp;display=swap');
    </style>
  </defs>

  <!-- PASSAPORTE -->
  <g transform="translate(14, 12)">

    <!-- Capa do passaporte -->
    <rect x="0" y="0" width="88" height="118" rx="6" ry="6" fill="#4F6F52"/>

    <!-- Lombada -->
    <rect x="0" y="0" width="10" height="118" rx="4" ry="4" fill="#3a5240"/>

    <!-- Detalhe dourado topo -->
    <rect x="16" y="10" width="58" height="3" rx="1.5" fill="#E6A15A" opacity="0.7"/>

    <!-- Símbolo central — estrela/brasão simplificado -->
    <circle cx="44" cy="44" r="16" fill="none" stroke="#E6A15A" stroke-width="1.5" opacity="0.8"/>
    <circle cx="44" cy="44" r="10" fill="none" stroke="#E6A15A" stroke-width="1" opacity="0.5"/>
    <!-- Aviãozinho no centro -->
    <g transform="translate(44,44)" fill="#E6A15A" opacity="0.9">
      <polygon points="0,-7 2,-1 7,1 2,1 1,7 0,4 -1,7 -2,1 -7,1 -2,-1" />
    </g>

    <!-- Texto PASSPORT -->
    <text x="44" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#E6A15A" opacity="0.7" letter-spacing="2">PASSPORT</text>

    <!-- Linhas de dados -->
    <rect x="16" y="76" width="58" height="1.5" rx="0.75" fill="#8FAF9A" opacity="0.4"/>
    <rect x="16" y="82" width="48" height="1.5" rx="0.75" fill="#8FAF9A" opacity="0.4"/>
    <rect x="16" y="88" width="52" height="1.5" rx="0.75" fill="#8FAF9A" opacity="0.4"/>

    <!-- Detalhe dourado base -->
    <rect x="16" y="100" width="58" height="3" rx="1.5" fill="#E6A15A" opacity="0.7"/>

    <!-- CARIMBOS -->

    <!-- Carimbo 1 — canto superior direito, vermelho/terracota -->
    <g transform="translate(58, 16) rotate(18)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#D97A3A" stroke-width="1.8" opacity="0.85"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#D97A3A" stroke-width="0.8" opacity="0.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Georgia, serif" font-size="4.5" fill="#D97A3A" opacity="0.85" letter-spacing="0.5">BRASIL</text>
      <text x="0" y="3" text-anchor="middle" font-family="Georgia, serif" font-size="3.5" fill="#D97A3A" opacity="0.7">2026</text>
      <text x="0" y="9" text-anchor="middle" font-family="Georgia, serif" font-size="3" fill="#D97A3A" opacity="0.6">✈</text>
    </g>

    <!-- Carimbo 2 — esquerda meio, verde claro -->
    <g transform="translate(28, 58) rotate(-12)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#8FAF9A" stroke-width="1.5" opacity="0.9"/>
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#8FAF9A" stroke-width="0.6" opacity="0.5"/>
      <text x="0" y="-2.5" text-anchor="middle" font-family="Georgia, serif" font-size="3.8" fill="#8FAF9A" opacity="0.9" letter-spacing="0.3">VISADO</text>
      <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="3" fill="#8FAF9A" opacity="0.7">✓</text>
    </g>

    <!-- Carimbo 3 — canto inferior direito, âmbar -->
    <g transform="translate(62, 95) rotate(8)">
      <rect x="-13" y="-9" width="26" height="18" rx="3" fill="none" stroke="#E6A15A" stroke-width="1.5" opacity="0.8"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="4" fill="#E6A15A" opacity="0.85" letter-spacing="0.5">ENTRADA</text>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="3.2" fill="#E6A15A" opacity="0.7">20·06·2026</text>
    </g>

  </g>

  <!-- TEXTOS DO NOME -->

  <!-- Tagline superior -->
  <text x="132" y="42" font-family="'Caveat', cursive, Georgia" font-size="17" font-weight="600" fill="#8FAF9A" letter-spacing="1">imersão</text>

  <!-- Nome principal -->
  <text x="128" y="90" font-family="'Gabriela', serif, Georgia" font-size="46" fill="#4F6F52" letter-spacing="-1">Hora de</text>
  <text x="128" y="135" font-family="'Gabriela', serif, Georgia" font-size="46" fill="#D97A3A" letter-spacing="-1">Decolar</text>

</svg>
